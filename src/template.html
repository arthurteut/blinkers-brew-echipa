<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Ghidul echipei · Blinkers Brew</title>
<meta name="description" content="Ghidul intern al echipei Blinkers Brew.">
<meta name="theme-color" content="#151515">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e7e7e4;      /* gri de afiș */
    --paper-hi: #f4f4f1;   /* hârtie nouă */
    --ink: #151515;        /* negrul logo-ului */
    --ink-soft: #55554f;
    --chalk: #efeeea;      /* text pe negru */
    --line: rgba(21, 21, 21, .16);
    --beer: #f09a1a;       /* culoarea berii (Mango Hazy) */
    --hazy: #3a35c9;       /* albastrul Hazy IPA */
    --warn: #b3261e;
    --f-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --f-script: "Instrument Serif", Georgia, serif;
    --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
    --wrap: 1280px;
    --gutter: max(16px, min(4vw, 40px));
    --top: 68px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--f-display); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.05; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--beer); outline-offset: 2px; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
  .hidden { display: none !important; }
  .eyebrow { font: 500 .74rem/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  .mega { font-weight: 900; font-stretch: 125%; text-transform: uppercase; letter-spacing: -.02em; line-height: .9; text-wrap: balance; }
  .script { font-family: var(--f-script); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: -.01em; }
  .logo { display: block; aspect-ratio: 768 / 579; background: currentColor; -webkit-mask: url(assets/img/logo-full.png) center / contain no-repeat; mask: url(assets/img/logo-full.png) center / contain no-repeat; }

  /* Hârtie ruptă între benzi */
  .torn { position: relative; }
  .torn::before { content: ""; position: absolute; left: 0; right: 0; top: -38px; height: 40px; background: var(--band, var(--paper)); -webkit-mask: url(assets/img/torn.png) center bottom / 1600px 100% repeat-x; mask: url(assets/img/torn.png) center bottom / 1600px 100% repeat-x; pointer-events: none; z-index: 2; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--chalk); padding: 13px 22px; font: 800 .82rem/1 var(--f-display); font-stretch: 115%; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border-radius: 999px; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .btn:hover { transform: translateY(-2px) rotate(-1.5deg); }
  .btn.ghost { background: transparent; color: var(--ink); }

  /* ---------- Lacăt ---------- */
  #lock { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: var(--ink); }
  .lock-photo { position: relative; overflow: hidden; margin: 0; background: #d9d6e0; }
  .lock-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lock-side { display: grid; place-items: center; padding: 40px var(--gutter); }
  .lock-card { width: 100%; max-width: 440px; background: var(--paper-hi); padding: clamp(26px, 6vw, 44px); border: 2px solid var(--ink); box-shadow: 10px 10px 0 var(--beer); transform: rotate(-1deg); }
  .lock-card .eyes { width: 100%; max-width: 260px; display: block; margin: 0 auto 22px; color: var(--ink); }
  .lock-card h1 { font-size: clamp(2rem, 6vw, 2.8rem); margin: 10px 0 8px; }
  .lock-card p { color: var(--ink-soft); margin: 0 0 22px; }
  .field { display: block; width: 100%; padding: 14px 16px; border: 2px solid var(--ink); background: var(--paper); font-size: 1rem; border-radius: 0; }
  .field:focus { outline: 3px solid var(--beer); outline-offset: 0; }
  .lock-card .btn { width: 100%; margin-top: 12px; padding: 16px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 16px; font: 400 .8rem/1.3 var(--f-mono); color: var(--ink-soft); }
  .err { color: var(--warn); font-size: .9rem; min-height: 1.4em; margin-top: 12px; }
  @media (max-width: 820px) {
    #lock { grid-template-columns: 1fr; grid-template-rows: 32vh auto; }
    .lock-side { margin-top: -40px; position: relative; padding-bottom: 48px; }
  }
  .eyes .pupil { transition: transform .22s cubic-bezier(.3, 1.4, .5, 1); }
  .eyes.fast .pupil { transition: transform .09s ease-in; }

  /* ---------- Antet ---------- */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 2px solid var(--ink); }
  .bar { display: flex; align-items: center; gap: 20px; height: var(--top); }
  .bar .logo { height: 44px; color: var(--ink); flex: none; }
  .bar .logo:hover { animation: blink .35s; }
  @keyframes blink { 40% { transform: scaleY(.15); } }
  .bar nav { display: flex; gap: 2px; margin-left: auto; }
  .bar nav a { font: 800 .76rem/1 var(--f-display); font-stretch: 112%; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; padding: 10px 11px; position: relative; }
  .bar nav a::after { content: ""; position: absolute; left: 11px; right: 100%; bottom: 3px; height: 3px; background: var(--beer); transition: right .25s; }
  .bar nav a:hover::after, .bar nav a.on::after { right: 11px; }
  .icon-btn { background: none; border: 0; padding: 8px; display: inline-flex; color: var(--ink); }
  .icon-btn svg { width: 24px; height: 24px; }
  #menuBtn { display: none; }
  .search-top { position: relative; flex: 0 1 300px; }
  .search-top input { width: 100%; padding: 10px 14px 10px 38px; border: 2px solid var(--ink); background: var(--paper-hi); border-radius: 999px; font-size: .92rem; }
  .search-top input:focus { outline: 3px solid var(--beer); outline-offset: 0; }
  .search-top svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; }

  /* ---------- Căutare ---------- */
  #results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: min(420px, calc(100vw - 32px)); background: var(--paper-hi); color: var(--ink); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); max-height: 70vh; overflow: auto; z-index: 30; text-align: left; }
  .res-group { padding: 10px 0; border-bottom: 1.5px solid var(--line); }
  .res-group:last-child { border-bottom: 0; }
  .res-group .eyebrow { padding: 4px 16px 6px; display: block; }
  .res { display: block; padding: 9px 16px; text-decoration: none; font-size: .93rem; line-height: 1.35; }
  .res:hover, .res.sel { background: color-mix(in srgb, var(--beer) 22%, var(--paper-hi)); }
  .res small { display: block; color: var(--ink-soft); font: 400 .76rem/1.3 var(--f-mono); margin-top: 3px; }
  .res mark { background: var(--beer); color: inherit; }
  .res-empty { padding: 18px 16px; color: var(--ink-soft); }

  /* ---------- Acasă ---------- */
  .hero { background: var(--ink); color: var(--chalk); padding: clamp(40px, 7vw, 88px) 0 clamp(70px, 9vw, 110px); overflow-x: clip; }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
  .hero .eyebrow { color: #a9a9a2; }
  .hero h1 { font-size: clamp(2.5rem, 7vw, 5.6rem); margin: 16px 0 18px; }
  .hero h1 .script { display: block; font-size: 1.05em; line-height: .95; }
  .hero h1 em { font-style: italic; background: linear-gradient(transparent 60%, var(--beer) 60%, var(--beer) 92%, transparent 92%); padding: 0 .06em; color: var(--chalk); }
  .hero p.lead { color: #c9c9c2; max-width: 52ch; margin: 0 0 28px; font-size: 1.05rem; }
  .hero-search { position: relative; max-width: 680px; }
  .hero-search input { width: 100%; padding: 19px 20px 19px 54px; font-size: 1.06rem; border: 2px solid var(--chalk); border-radius: 999px; background: var(--paper-hi); color: var(--ink); }
  .hero-search input:focus { outline: 3px solid var(--beer); outline-offset: 2px; }
  .hero-search > svg { position: absolute; left: 21px; top: 30px; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink); }
  .hint { color: #a9a9a2; font: 400 .8rem/1.6 var(--f-mono); margin-top: 14px; }
  .hint button { background: none; border: 0; color: var(--beer); text-decoration: underline; padding: 0 3px; font: inherit; }
  .collage { position: relative; aspect-ratio: 4 / 5; max-width: 440px; width: 100%; justify-self: center; }
  .print { position: absolute; margin: 0; background: var(--paper-hi); padding: 9px 9px 34px; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .7); transform: rotate(var(--r)); }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .print figcaption { position: absolute; left: 11px; right: 11px; bottom: 7px; font: italic 400 1.05rem/1.1 var(--f-script); color: var(--ink); }
  .tape { position: absolute; width: 84px; height: 24px; background: rgba(240, 238, 228, .8); top: -11px; left: 50%; transform: translateX(-50%) rotate(-4deg); z-index: 2; clip-path: polygon(2% 0, 98% 4%, 100% 50%, 97% 100%, 3% 96%, 0 50%); }
  .collage .p1 { width: 64%; height: 60%; left: 0; top: 2%; --r: -5deg; }
  .collage .p2 { width: 58%; height: 54%; right: 0; top: 28%; --r: 4deg; z-index: 2; }
  .collage .p3 { width: 46%; height: 38%; left: 6%; bottom: 0; --r: -2deg; z-index: 3; }
  .sticker { position: absolute; right: 2%; top: 0; z-index: 4; width: 116px; height: 116px; border-radius: 50%; background: var(--beer); color: var(--ink); display: grid; place-items: center; text-align: center; font: 900 .8rem/1.05 var(--f-display); font-stretch: 125%; text-transform: uppercase; transform: rotate(12deg); padding: 10px; }
  .sticker span { display: block; font: 500 .62rem/1.2 var(--f-mono); letter-spacing: .08em; margin-top: 4px; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } .collage { max-width: 340px; } }

  .today { --band: var(--paper); background: var(--paper); padding: 34px 0 10px; }
  .today-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; border: 2px solid var(--ink); background: var(--paper-hi); padding: 18px 22px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #9c9c95; box-shadow: 0 0 0 4px rgba(0, 0, 0, .06); }
  .dot.open { background: #1f9d55; box-shadow: 0 0 0 4px rgba(31, 157, 85, .2); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(31, 157, 85, 0); } }
  .today-card strong { font-weight: 900; font-stretch: 120%; text-transform: uppercase; font-size: 1.15rem; display: block; }
  .today-card small { color: var(--ink-soft); font: 400 .8rem/1.4 var(--f-mono); }
  @media (max-width: 640px) { .today-card { grid-template-columns: auto 1fr; } .today-card .btn { grid-column: 1 / -1; } }

  section.block { padding: clamp(40px, 6vw, 72px) 0; }
  section.block.hi { background: var(--paper-hi); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .block-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .block-head h2 { font-size: clamp(1.9rem, 4.6vw, 3.4rem); margin-top: 10px; }

  .moments { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .moment { display: flex; flex-direction: column; justify-content: space-between; min-height: 190px; padding: 22px; background: var(--paper-hi); border: 2px solid var(--ink); text-decoration: none; transform: rotate(var(--r, 0deg)); transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), background .2s, color .2s; }
  .moment:hover { transform: rotate(0) translateY(-6px); background: var(--ink); color: var(--chalk); }
  .moment:hover .eyebrow { color: #a9a9a2; }
  .moment h3 { font-weight: 900; font-stretch: 112%; text-transform: uppercase; font-size: 1.3rem; margin: 10px 0 8px; overflow-wrap: anywhere; }
  .moment p { margin: 0; font-size: .92rem; }
  .moment .go { margin-top: 18px; font: 500 .72rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
  .moment.accent { background: var(--beer); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-hi); font: 800 .78rem/1 var(--f-display); font-stretch: 110%; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; white-space: nowrap; }
  .chip:hover { background: color-mix(in srgb, var(--beer) 30%, var(--paper-hi)); }
  .chip.on { background: var(--ink); color: var(--chalk); }

  .role-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .role-card { display: block; padding: 22px; border: 2px solid var(--ink); background: var(--paper-hi); text-decoration: none; transition: transform .3s cubic-bezier(.3, 1.5, .5, 1); }
  .role-card:hover { transform: translateY(-5px) rotate(-.8deg); box-shadow: 8px 8px 0 var(--ink); }
  .role-card h3 { font-weight: 900; font-stretch: 122%; text-transform: uppercase; font-size: 1.3rem; margin: 14px 0 8px; }
  .role-card p { margin: 0; font-size: .92rem; color: var(--ink-soft); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .person { font: 500 .76rem/1 var(--f-mono); padding: 6px 9px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 2px solid var(--ink); background: var(--paper-hi); }
  .stat { padding: 18px 20px; border-right: 1.5px solid var(--ink); }
  .stat:last-child { border-right: 0; }
  .stat strong { display: block; font: 900 2.4rem/1 var(--f-display); font-stretch: 125%; font-variant-numeric: tabular-nums; }
  .stat span { font: 400 .78rem/1.3 var(--f-mono); color: var(--ink-soft); }
  @media (max-width: 640px) { .stat { border-right: 0; border-bottom: 1.5px solid var(--ink); } .stat:last-child { border-bottom: 0; } }

  /* ---------- Fișa locației ---------- */
  .fisa { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .card { background: var(--paper-hi); border: 2px solid var(--ink); padding: 22px; }
  .card > h3 { font: 500 .74rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 12px; }
  .kv { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 10px 0; border-bottom: 1.5px solid var(--line); font-size: .94rem; align-items: baseline; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { flex: 1 1 160px; min-width: 0; }
  .kv .k small { display: block; color: var(--ink-soft); font: 400 .76rem/1.35 var(--f-mono); margin-top: 3px; }
  .kv .v { text-align: right; margin-left: auto; max-width: 100%; font-variant-numeric: tabular-nums; font-weight: 600; }
  .kv .v a { text-decoration: none; border-bottom: 2px solid var(--beer); }
  .kv.now { background: color-mix(in srgb, var(--beer) 25%, transparent); margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
  .todo { display: inline-block; font: 500 .72rem/1.2 var(--f-mono); color: #7a5a12; border: 1.5px dashed var(--beer); background: #fff7e6; padding: 3px 8px; white-space: nowrap; font-weight: 500; }
  .todo-count { font: 400 .8rem/1.3 var(--f-mono); color: #7a5a12; }
  .note-card { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
  .note-card h4 { font-weight: 900; font-stretch: 120%; text-transform: uppercase; font-size: 1rem; margin-bottom: 6px; color: var(--beer); }
  .note-card p { margin: 0 0 14px; color: #c9c9c2; font-size: .93rem; }
  .note-card p:last-child { margin-bottom: 0; }
  @media (max-width: 640px) { .kv .v { text-align: left; margin-left: 0; } }

  .marquee { background: var(--ink); color: var(--chalk); overflow: hidden; padding: 18px 0 20px; }
  .mq-track { display: flex; width: max-content; }
  .mq-track span { font: 900 clamp(1.6rem, 4vw, 2.8rem)/1 var(--f-display); font-stretch: 125%; text-transform: uppercase; white-space: nowrap; padding-right: .45em; }
  .mq-track span.script { font: italic 400 clamp(1.9rem, 4.6vw, 3.2rem)/1 var(--f-script); text-transform: none; color: var(--beer); }
  .mq-track i { display: inline-block; width: .45em; height: .45em; border-radius: 50%; background: var(--beer); margin: auto .6em auto 0; align-self: center; }

  /* ---------- Benzi de titlu ---------- */
  .band { background: var(--paper-hi); border-bottom: 2px solid var(--ink); padding: clamp(30px, 5vw, 56px) 0; }
  .crumbs { font: 400 .78rem/1 var(--f-mono); color: var(--ink-soft); margin-bottom: 16px; }
  .crumbs a { text-decoration: none; border-bottom: 1.5px solid var(--line); }
  .band h1 { font-size: clamp(2.2rem, 6vw, 4.4rem); margin: 10px 0 10px; }
  .band .sub { font-size: 1.05rem; color: var(--ink-soft); margin: 0; max-width: 62ch; }
  .profile { margin-top: 22px; background: var(--paper); padding: 18px 22px; border-left: 6px solid var(--beer); max-width: 860px; }
  .profile p { margin: 0; }

  .filterbar { position: sticky; top: var(--top); z-index: 10; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1.5px solid var(--ink); padding: 12px 0; }
  .filterbar .wrap { display: grid; gap: 10px; }
  .filterbar .row { display: flex; gap: 12px; align-items: center; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filterbar .row::-webkit-scrollbar { display: none; }
  .filterbar .lbl { font: 500 .72rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); flex: none; width: 84px; }
  .filterbar .chips { flex-wrap: nowrap; }

  /* ---------- Procese ---------- */
  .moment-head { margin: 44px 0 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .moment-head:first-child { margin-top: 0; }
  .moment-head h2 { font-size: clamp(1.6rem, 3.6vw, 2.5rem); }
  .proc { border: 2px solid var(--ink); background: var(--paper-hi); margin-bottom: 12px; scroll-margin-top: calc(var(--top) + 120px); }
  .proc > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; }
  .proc > summary::-webkit-details-marker { display: none; }
  .proc > summary:hover { background: color-mix(in srgb, var(--beer) 14%, var(--paper-hi)); }
  .proc .code { font: 500 .85rem/1 var(--f-mono); color: var(--ink-soft); }
  .proc .name { font: 900 1.15rem/1.15 var(--f-display); font-stretch: 115%; text-transform: uppercase; }
  .proc .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .chev { width: 20px; height: 20px; transition: transform .25s; }
  .proc[open] .chev { transform: rotate(180deg); }
  .proc[open] > summary { border-bottom: 2px solid var(--ink); background: var(--ink); color: var(--chalk); }
  .proc[open] > summary .code { color: #a9a9a2; }
  .proc-body { padding: 20px; }
  .miza { font: italic 400 1.25rem/1.3 var(--f-script); margin: 0 0 20px; padding-left: 14px; border-left: 4px solid var(--beer); }

  .pill { display: inline-block; font: 500 .7rem/1 var(--f-mono); letter-spacing: .04em; padding: 6px 8px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-hi); color: var(--ink); text-decoration: none; white-space: nowrap; }
  a.pill:hover { background: var(--ink); color: var(--chalk); }
  .pill.r-MT { background: var(--ink); color: var(--chalk); }
  .pill.r-V { background: var(--beer); }
  .pill.r-PHD { background: var(--hazy); color: #fff; border-color: var(--hazy); }
  .pill.crit { background: var(--warn); color: #fff; border-color: var(--warn); }
  .pill.pr { border-style: dashed; }
  .pill.big { font-size: .82rem; padding: 7px 11px; }

  .subp { margin: 0 0 22px; }
  .subp:last-child { margin-bottom: 0; }
  .subp h4 { font: 800 .95rem/1.2 var(--f-display); font-stretch: 110%; text-transform: uppercase; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; }
  .tasks { display: grid; gap: 8px; }
  .task { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 12px 14px; background: var(--paper); border-left: 5px solid var(--line); }
  .task.mine { border-left-color: var(--beer); background: color-mix(in srgb, var(--beer) 10%, var(--paper)); }
  .task .t { font-weight: 500; }

  .section-title { font: 900 clamp(1.4rem, 3vw, 2rem)/1 var(--f-display); font-stretch: 122%; text-transform: uppercase; margin: 0 0 18px; }

  /* ---------- Procedură ---------- */
  .facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border: 2px solid var(--ink); background: var(--paper-hi); margin: 0 0 32px; }
  .facts-grid div { padding: 16px 18px; border-right: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); }

  ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 10px; }

  ol.steps li::before { content: counter(s, decimal-leading-zero); font: 900 1.9rem/1 var(--f-display); font-stretch: 125%; color: var(--ink); background: var(--beer); border-radius: 50%; width: 58px; height: 58px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  ol.steps li:nth-child(even) { transform: rotate(.35deg); }

  table.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; background: var(--paper-hi); border: 2px solid var(--ink); }

  .tbl td { padding: 12px; border-bottom: 1.5px solid var(--line); vertical-align: top; }
  .tbl-wrap { overflow-x: auto; }
  .selects { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .selects select { padding: 11px 36px 11px 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-hi) url("data:image/svg+xml;utf8,<svg fill='black' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") no-repeat right 8px center; -webkit-appearance: none; appearance: none; font-size: .9rem; max-width: 100%; }

  footer .logo { height: 54px; color: var(--chalk); }
  footer button { background: none; border: 1.5px solid #55554f; color: var(--chalk); padding: 9px 16px; border-radius: 999px; font: inherit; }
  footer button:hover { border-color: var(--beer); color: var(--beer); }

  /* Apariție la scroll */
  @media (prefers-reduced-motion: no-preference) {

    .print { animation: slap .8s cubic-bezier(.2, 1.4, .4, 1) backwards; }

  }
  @keyframes slap { from { opacity: 0; transform: scale(1.15) rotate(calc(var(--r, -1deg) * 3)); } }
  @keyframes spin { from { transform: rotate(12deg); } to { transform: rotate(372deg); } }

  @media (max-width: 1060px) {

    .bar nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--paper-hi); flex-direction: column; padding: 6px var(--gutter) 14px; border-bottom: 2px solid var(--ink); }

  @media (max-width: 640px) {

    .proc > summary { grid-template-columns: 1fr auto; gap: 8px 12px; padding: 14px; }

    ol.steps li { grid-template-columns: 44px 1fr; gap: 12px; font-size: 1rem; }

</style>

<body>

<div id="lock">
  <figure class="lock-photo"><img src="assets/img/l-pour.jpg" alt="Bere turnată într-un pahar Blinkers Brew"></figure>

    <input type="text" name="username" value="echipa" autocomplete="username" hidden>

  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap bar">
      <a class="logo" href="#/" aria-label="Acasă"></a>
      <div class="search-top" id="topSearchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="topSearch" placeholder="Caută: keg, raport Z, vârstă…" aria-label="Caută în ghid" autocomplete="off">
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Meniu" aria-expanded="false">

      </button>

        <a href="#/" data-nav="home">Acasă</a>

        <span>Ghid intern · document confidențial · nu se distribuie în afara echipei</span>
        <button id="logout" type="button">Ieși din cont</button>
      </div>
    </div>
  </footer>
</div>

<script>
const PAYLOAD = /*PAYLOAD*/null;
const LS_KEY = 'bb-echipa-parola';
let D = null;

// ---------- Ochii BB (logo-ul cu pupile care se mișcă) ----------
const B_SIL = 'M0,0 H240 C295,0 330,35 330,85 C330,125 318,160 300,180 C325,195 340,220 340,255 V285 C340,335 305,370 255,370 H0 Z';
const SLOT1 = 'M15,90 H265 A42.5,42.5 0 0 1 265,175 H15 Z';
const SLOT2 = 'M15,190 H275 A47.5,47.5 0 0 1 275,285 H15 Z';
function makeEyes(host) {
  host.innerHTML = `<svg class="eyes" viewBox="0 0 740 372" role="img" aria-label="Blinkers Brew">
    <defs><clipPath id="eyc"><rect x="0" y="0" width="740" height="176"/></clipPath>
    <mask id="eym" maskUnits="userSpaceOnUse" x="0" y="0" width="740" height="372">
      <g fill="#fff"><path d="${B_SIL}"/><path d="${B_SIL}" transform="translate(395 0)"/></g>
      <g fill="#000"><path d="${SLOT1}"/><path d="${SLOT2}"/><g transform="translate(395 0)"><path d="${SLOT1}"/><path d="${SLOT2}"/></g></g>
      <g fill="#fff" clip-path="url(#eyc)"><circle class="pupil" cx="175" cy="133" r="42.5"/><circle class="pupil" cx="570" cy="133" r="42.5"/></g>
    </mask></defs>
    <rect width="740" height="372" fill="currentColor" mask="url(#eym)"/></svg>`;
  const svg = host.firstElementChild, pupils = svg.querySelectorAll('.pupil');
  let x = 0, dy = 0;
  const set = () => pupils.forEach(p => p.style.transform = `translate(${x}px, ${dy}px)`);
  return {
    look(nx) { x = nx; set(); },
    blink() { svg.classList.add('fast'); dy = -43; set(); setTimeout(() => { dy = 0; set(); setTimeout(() => svg.classList.remove('fast'), 120); }, 110); },
  };
}
const lockEyes = makeEyes(document.getElementById('lockEyes'));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!REDUCED) {
  setTimeout(() => lockEyes.blink(), 900);
  const blinker = setInterval(() => { if (document.getElementById('lock').classList.contains('hidden')) clearInterval(blinker); else lockEyes.blink(); }, 4200);
  addEventListener('pointermove', e => {
    const r = document.getElementById('lockEyes').getBoundingClientRect();
    lockEyes.look(Math.max(-40, Math.min(40, (e.clientX - (r.left + r.width / 2)) / 8)));
  });
}

// ---------- Decriptare ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const store = {
  get() { try { return localStorage.getItem(LS_KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(LS_KEY, v); } catch (e) {} },
  clear() { try { localStorage.removeItem(LS_KEY); } catch (e) {} },
};
async function unlock(pw, remember) {
  D = await decrypt(pw);
  if (remember) store.set(pw);
  prepare();
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  route();
}
document.getElementById('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('unlockBtn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Se deschide…'; err.textContent = '';
  try { await unlock(document.getElementById('pw').value, document.getElementById('remember').checked); }
  catch (x) { err.textContent = 'Parolă greșită. Cere-o managerului de taproom.'; lockEyes.blink(); }
  btn.disabled = false; btn.textContent = 'Intră';
});
document.getElementById('logout').addEventListener('click', () => { store.clear(); location.hash = ''; location.reload(); });
(async () => {
  if (!PAYLOAD) { document.getElementById('err').textContent = 'Pagina nu a fost construită încă (lipsește conținutul).'; return; }
  const saved = store.get();
  if (saved) { try { await unlock(saved, true); } catch (e) { store.clear(); } }
})();

// ---------- Utilitare ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const enc = encodeURIComponent;
const $ = s => document.querySelector(s);
const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 5 5 9-10"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};
const MOMENT_TEXT = {
  'Deschidere': 'Ce faci până la 16:00, ca primul client să găsească totul gata.',
  'În tură': 'Servirea, berea la draft, hot dog-ul, casa și paharele.',
  'Închidere': 'Ultima comandă, raportul Z, curățenia și alarma.',
  'Săptămânal': 'Inventar, comenzi, programul echipei, colegii noi.',
  'Situații speciale': 'Client băut, defecțiune, reclamație, pahar spart.',
};
let P, ROL, PROC;
function prepare() {
  P = D.procese;
  ROL = Object.fromEntries(D.roluri.map(r => [r.cod, r]));
  PROC = Object.fromEntries(D.proceduri.map(p => [p.cod, p]));
  buildIndex();
}
const rolName = r => ROL[r]?.nume || r;
const rolPill = r => r ? `<a class="pill r-${esc(r)}" href="#/r/${enc(r)}" title="${esc(rolName(r))}">${esc(r)}</a>` : '';
// În interiorul unui link (rândurile .prow) nu punem alt link: browserul le-ar despărți.
const rolTag = r => r ? `<span class="pill r-${esc(r)}" title="${esc(rolName(r))}">${esc(r)}</span>` : '';
const prioPill = p => p ? `<span class="pill ${p === 'Critică' ? 'crit' : ''}">${esc(p)}</span>` : '';
const prPill = c => c ? `<a class="pill pr" href="#/pr/${enc(c)}" title="${esc(PROC[c]?.titlu || '')}">${esc(c)}</a>` : '';
const tasksOf = pc => D.taskuri.filter(t => t.p === pc);
const procsOf = pc => D.proceduri.filter(p => p.p === pc);
const processesOf = m => Object.values(P).filter(p => p.moment === m);
// Codurile PR-xx.y din text devin linkuri.
const linkCodes = s => esc(s).replace(/PR-\d\d\.\d+/g, c => PROC[c] ? `<a href="#/pr/${c}">${c}</a>` : c);

// ---------- Program: azi și acum ----------
const ZILE = ['Luni', 'Marți', 'Miercuri', 'Joi', 'Vineri', 'Sâmbătă', 'Duminică'];
const progZi = i => D.loc.program.find(z => z.zi === ZILE[i]);
function interval(ore) {
  const m = /^(\d\d):(\d\d) – (\d\d):(\d\d)$/.exec(ore || '');
  if (!m) return null;
  const a = +m[1] * 60 + +m[2]; let b = +m[3] * 60 + +m[4];
  if (b <= a) b += 1440;
  return [a, b];
}
const hhmm = t => `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
function status() {
  const now = new Date(), zi = (now.getDay() + 6) % 7, t = now.getHours() * 60 + now.getMinutes();
  const azi = progZi(zi), ieri = progZi((zi + 6) % 7);
  const iA = interval(azi?.ore), iI = interval(ieri?.ore);
  if (iI && t + 1440 < iI[1]) return { open: true, zi: ieri.zi, ore: ieri.ore, close: iI[1], azi: zi };
  if (iA && t >= iA[0] && t < iA[1]) return { open: true, zi: azi.zi, ore: azi.ore, close: iA[1], azi: zi };
  return { open: false, zi: ZILE[zi], ore: azi?.ore || '', start: iA?.[0], azi: zi };
}

// ---------- Rutare ----------
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const i = h.indexOf('?');
  const path = i < 0 ? h : h.slice(0, i), q = i < 0 ? '' : h.slice(i + 1);
  const params = Object.fromEntries(new URLSearchParams(q));
  const dec = x => { try { return decodeURIComponent(x); } catch (e) { return x; } };
  return { parts: path.split('/').filter(Boolean).map(dec), params };
}
window.addEventListener('hashchange', () => { if (D) route(); });
function route() {
  const { parts, params } = parseHash();
  const [a, b] = parts;
  let html, nav = 'home';
  if (a === 'p' && P[b]) { html = viewProcess(P[b]); nav = 'procese'; }
  else if (a === 'procese') { html = viewProcesses(params); nav = 'procese'; }
  else if (a === 'pr' && PROC[b]) { html = viewProcedure(PROC[b]); nav = 'proceduri'; }
  else if (a === 'proceduri') { html = viewProcedures(params); nav = 'proceduri'; }
  else if (a === 'r' && ROL[b]) { html = viewRole(ROL[b]); nav = 'roluri'; }
  else if (a === 'roluri') { html = viewRoles(); nav = 'roluri'; }
  else if (a === 'ghid') { html = viewGuide(); nav = 'ghid'; }
  else html = viewHome();
  $('#view').innerHTML = html;
  document.querySelectorAll('[data-nav]').forEach(x => x.classList.toggle('on', x.dataset.nav === nav));
  $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
  closeResults();
  wireView();
  reveal();
  if (!params.keep) window.scrollTo({ top: 0, behavior: 'instant' });
  const open = params.deschide && document.getElementById('proc-' + params.deschide);
  if (open) { open.open = true; setTimeout(() => open.scrollIntoView({ block: 'start' }), 30); }
}
$('#menuBtn').addEventListener('click', () => {
  const n = $('#nav'); n.classList.toggle('open');
  $('#menuBtn').setAttribute('aria-expanded', n.classList.contains('open'));
});

// ---------- Acasă ----------
const IMG = n => `assets/img/${n}.jpg`;
function todayHtml() {
  const s = status();
  let title, sub;
  if (s.open) { title = 'Deschis acum'; sub = `${s.zi}: ${s.ore} · ultima comandă la ${hhmm(s.close - 30)}`; }
  else if (s.start !== undefined && new Date().getHours() * 60 + new Date().getMinutes() < s.start) { title = `Deschidem azi la ${hhmm(s.start)}`; sub = `${s.zi}: ${s.ore} · ultima comandă la ${hhmm(interval(s.ore)[1] - 30)}`; }
  else { title = 'Închis acum'; sub = s.ore ? `${s.zi}: ${s.ore}` : `${s.zi}: programul e de completat`; }
  return `<div class="today-card rv"><span class="dot ${s.open ? 'open' : ''}"></span>
    <div><strong>${esc(title)}</strong><small>${esc(sub)} · ${esc(D.loc.adresa)}</small></div>
    <a class="btn ${s.open ? '' : 'ghost'}" href="#/procese?moment=${enc(s.open ? 'În tură' : 'Deschidere')}">${s.open ? 'Tura de acum' : 'Pregătește deschiderea'} →</a></div>`;
}
function viewHome() {
  const tilt = [-1.2, .8, -.6, 1, -.9];
  const moments = D.momente.map((m, i) => {
    const procs = processesOf(m), n = procs.reduce((k, p) => k + tasksOf(p.cod).length, 0);
    return `<a class="moment rv ${i === 1 ? 'accent' : ''}" style="--r:${tilt[i % 5]}deg" href="#/procese?moment=${enc(m)}">
      <div><span class="eyebrow">${procs.length} procese · ${n} task-uri</span><h3>${esc(m)}</h3><p>${esc(MOMENT_TEXT[m] || '')}</p></div>
      <span class="go">Vezi ce faci →</span></a>`;

      ${t.verif ? `<span>${ICON.check}${esc(t.verif)}</span>` : ''}
    </div></div>`;
}
function procRow(p) {
  return `<a class="prow" href="#/pr/${enc(p.cod)}">
    <span class="c">${esc(p.cod)}</span>
    <span class="ti">${esc(p.titlu)}<small>Când: ${esc(p.decl)} · ${p.pasi.length} pași</small></span>
    <span class="meta">${rolTag(p.rol)}${prioPill(p.prio)}</span></a>`;
}
function processBody(p, rol) {
  let tasks = tasksOf(p.cod), procs = procsOf(p.cod);
  if (rol) { tasks = tasks.filter(t => t.rol === rol); procs = procs.filter(x => x.rol === rol); }
  let h = p.miza ? `<p class="miza">${esc(p.miza)}</p>` : '';
  for (const s of p.sub) {
    const num = s.split(' ')[0];
    const ts = tasks.filter(t => t.sub === num);
    if (rol && !ts.length) continue;
    h += `<div class="subp"><h4>${esc(s)}</h4>${ts.length ? `<div class="tasks">${ts.map(t => taskHtml(t, rol)).join('')}</div>` : ''}</div>`;
  }
  if (rol && !tasks.length) h += `<p class="lvl4">Rolul ${esc(rolName(rol))} nu are task-uri directe în acest proces. Responsabil: ${esc(rolName(p.rol))}.</p>`;
  if (procs.length) h += `<h4 style="margin:24px 0 4px;font:800 .95rem/1 var(--f-display);text-transform:uppercase">Proceduri</h4><div class="proc-list">${procs.map(procRow).join('')}</div>`;
  return h;
}
function processItem(p, rol) {
  const mine = rol && tasksOf(p.cod).filter(t => t.rol === rol).length;
  return `<details class="proc rv" id="proc-${p.cod}">

    <div class="proc-body">${processBody(p, rol)}</div></details>`;
}
const visible = (p, rol) => !rol || p.rol === rol || tasksOf(p.cod).some(t => t.rol === rol) || procsOf(p.cod).some(x => x.rol === rol);
function viewProcesses(params) {
  const rol = ROL[params.rol] ? params.rol : '';
  const moment = D.momente.includes(params.moment) ? params.moment : '';
  const q = o => { const u = new URLSearchParams({ ...(rol && { rol }), ...(moment && { moment }), ...o, keep: 1 }); [...u].forEach(([k, v]) => !v && u.delete(k)); return '#/procese?' + u; };
  const roleChips = [`<a class="chip ${rol ? '' : 'on'}" href="${q({ rol: '' })}">Toți</a>`]

// ---------- Căutare ----------
let INDEX = [];
function buildIndex() {
  const add = (grp, title, sub, href, extra = '') => INDEX.push({ grp, title, sub, href, k: norm(title + ' ' + sub + ' ' + extra) });
  INDEX = [];
  D.roluri.forEach(r => add('Roluri', `${r.nume}`, `${r.cod} · ${r.oameni.join(', ')}`, `#/r/${enc(r.cod)}`, r.raspunde));
  Object.values(P).forEach(p => add('Procese', `${p.cod} · ${p.nume}`, p.moment, `#/procese?deschide=${p.cod}&moment=${enc(p.moment)}`, p.sub.join(' ') + ' ' + p.miza));
  D.proceduri.forEach(p => add('Proceduri', `${p.cod} · ${p.titlu}`, `${rolName(p.rol)} · ${p.decl}`, `#/pr/${enc(p.cod)}`, p.pasi.join(' ')));
  D.taskuri.forEach(t => add('Task-uri', t.t, `${t.p} · ${rolName(t.rol)} · ${t.cand}`, `#/procese?deschide=${t.p}&moment=${enc(P[t.p]?.moment || '')}`, t.verif));
  D.loc.contacte.forEach(c => add('Contacte', `${c.functie}${c.nume ? ' · ' + c.nume : ''}`, c.telefon || 'telefon de completat', '#/?keep=1', 'telefon contact'));
  D.loc.echipamente.forEach(e => add('Echipamente', e.nume, e.raportezi ? 'Defecțiune: anunți ' + e.raportezi : '', '#/?keep=1', 'defect defectiune echipament ' + e.detaliu));
  D.loc.program.forEach(z => add('Program', `${z.zi}: ${z.ore || 'de completat'}`, D.loc.adresa, '#/', 'program orar deschis'));
}
// Româna flexionează („vârstă” / „vârstei”): la cuvintele lungi acceptăm și rădăcina, fără ultima literă.
const stem = t => t.length >= 5 ? t.slice(0, -1) : t;
function search(q) {
  const terms = norm(q).split(/\s+/).filter(t => t.length > 1);
  if (!terms.length) return null;
  const hits = INDEX.map(it => {
    let sc = 0;
    for (const t of terms) {
      let i = it.k.indexOf(t), exact = i >= 0;
      if (!exact) i = it.k.indexOf(stem(t));
      if (i < 0) return null;
      sc += (i < 60 ? 3 : 1) + (exact ? 1 : 0);
      if (norm(it.title).includes(stem(t))) sc += 4;
    }
    return { it, sc };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc);
  return groupHits(hits, terms.map(stem));
}
function groupHits(hits, terms) {
  const groups = {};
  hits.forEach(h => { (groups[h.it.grp] = groups[h.it.grp] || []).length < 6 && groups[h.it.grp].push(h.it); });
  return { groups, terms };
}
function highlight(text, terms) {
  const n = norm(text), ranges = [];
  terms.forEach(t => { const i = n.indexOf(t); if (i >= 0) ranges.push([i, i + t.length]); });
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => b[0] - a[0]);
  let s = text;
  ranges.forEach(([a, b]) => { s = s.slice(0, a) + '\u0001' + s.slice(a, b) + '\u0002' + s.slice(b); });
  return esc(s).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
}
const ORDER = ['Proceduri', 'Task-uri', 'Procese', 'Roluri', 'Contacte', 'Echipamente', 'Program'];
let activeBox = null, sel = -1;
function renderResults(box, q) {
  closeResults();
  const r = search(q);
  if (!r) return;
  const el = document.createElement('div');
  el.id = 'results'; el.setAttribute('role', 'listbox');
  const gs = ORDER.filter(g => r.groups[g]);
  el.innerHTML = gs.length ? gs.map(g => `<div class="res-group"><span class="eyebrow">${g}</span>${r.groups[g].map(it => `<a class="res" href="${it.href}">${highlight(it.title, r.terms)}<small>${esc(it.sub)}</small></a>`).join('')}</div>`).join('')
    : `<div class="res-empty">Nimic găsit pentru „${esc(q)}”. Încearcă alt cuvânt sau întreabă managerul de taproom.</div>`;
  box.appendChild(el); activeBox = box; sel = -1;
}
function closeResults() { const r = document.getElementById('results'); if (r) r.remove(); activeBox = null; }
function wireSearch(input, box) {
  input.addEventListener('input', () => renderResults(box, input.value));
  input.addEventListener('focus', () => input.value && renderResults(box, input.value));
  input.addEventListener('keydown', e => {
    const items = [...box.querySelectorAll('.res')];
    if (e.key === 'Escape') { closeResults(); input.blur(); }
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && items.length) {
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((x, i) => x.classList.toggle('sel', i === sel)); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && items.length) { e.preventDefault(); go((items[sel] || items[0]).getAttribute('href')); input.value = ''; input.blur(); }
  });
}
// Același link de două ori (de ex. alt task din același proces) nu schimbă hash-ul: forțăm rutarea.
function go(href) { if (location.hash === href) route(); else location.hash = href; }
wireSearch($('#topSearch'), $('#topSearchBox'));
document.addEventListener('click', e => {
  const res = e.target.closest('.res');
  if (res) { e.preventDefault(); $('#topSearch').value = ''; go(res.getAttribute('href')); return; }
  if (activeBox && !activeBox.contains(e.target)) closeResults();
});
document.addEventListener('keydown', e => { if (e.key === '/' && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); ($('#heroSearch') || $('#topSearch')).focus(); } });

// ---------- Apariție la scroll ----------
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' }) : null;
function reveal() {
  document.querySelectorAll('#view .rv').forEach((el, i) => {
    if (!io) { el.classList.add('in'); return; }
    el.style.transitionDelay = `${Math.min(i % 6, 5) * 60}ms`;
    io.observe(el);
  });
}

function wireView() {
  const hs = $('#heroSearch');
  if (hs) {
    wireSearch(hs, $('#heroSearchBox'));
    document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { hs.value = b.dataset.q; hs.focus(); renderResults($('#heroSearchBox'), hs.value); }));
  }
  document.querySelectorAll('select[data-f]').forEach(s => s.addEventListener('change', () => {
    const q = new URLSearchParams();
    document.querySelectorAll('select[data-f]').forEach(x => x.value && q.set(x.dataset.f, x.value));
    q.set('keep', '1');
    location.hash = '#/proceduri?' + q.toString();
  }));
}
</script>
